<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="Live, interactive Avalonia UI vignettes running in WebAssembly.">
  <title>Avalonia Vignettes — Live Showcase</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div id="out">
    <div class="avalonia-splash" role="status" aria-live="polite">
      <div class="splash-copy">
        <strong>Avalonia Vignettes</strong>
        <span>Preparing the live WebAssembly showcase…</span>
      </div>
      <div class="splash-track"><span></span></div>
    </div>
  </div>
  <noscript>This showcase needs JavaScript to start the Avalonia WebAssembly runtime.</noscript>
  <script type="module" src="./main.js"></script>
</body>
</html>
