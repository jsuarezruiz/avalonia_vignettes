name: Pages

on:
  push:
    branches: [main]
    paths:
      - showcase/**
      - vignettes/**
      - Directory.Build.props
      - Directory.Build.targets
      - global.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Avalonia.Browser links SkiaSharp and HarfBuzz into the native runtime.
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Publish WebAssembly showcase
        run: |
          dotnet publish showcase/AvaloniaVignettes.Showcase.Browser/AvaloniaVignettes.Showcase.Browser.csproj \
            --configuration Release \
            --output "${RUNNER_TEMP}/showcase"

      # The site is a single commit on gh-pages, replaced on every deploy so the compiled
      # WebAssembly never piles up in history. Jekyll would drop the _framework folder.
      - name: Deploy to gh-pages
        shell: bash
        run: |
          site="${RUNNER_TEMP}/showcase/wwwroot"
          touch "$site/.nojekyll"

          cd "$site"
          git init --quiet --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "Deploy showcase from ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
