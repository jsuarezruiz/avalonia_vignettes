name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop-and-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test tests/AvaloniaVignettes.Tests/AvaloniaVignettes.Tests.csproj --configuration Release

      - name: Build desktop heads
        shell: bash
        run: |
          for project in vignettes/*/Desktop/*.Desktop.csproj; do
            dotnet build "$project" --configuration Release
          done

      - name: Exercise capture automation
        shell: bash
        run: |
          capture_dir="${RUNNER_TEMP}/basketball-capture"
          xvfb-run -a dotnet run \
            --project vignettes/basketball_ptr/Desktop/BasketballPullToRefresh.Desktop.csproj \
            --configuration Release \
            --no-build \
            -- \
            --capture "$capture_dir"

          test "$(find "$capture_dir" -name '*.png' | wc -l)" -eq 12

          failure_root="${RUNNER_TEMP}/capture-output-file"
          touch "$failure_root"

          if xvfb-run -a dotnet run \
            --project vignettes/basketball_ptr/Desktop/BasketballPullToRefresh.Desktop.csproj \
            --configuration Release \
            --no-build \
            -- \
            --capture "$failure_root/child"; then
            echo "Capture failure returned success." >&2
            exit 1
          fi

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build Android heads
        shell: bash
        run: |
          for project in vignettes/*/Android/*.Android.csproj; do
            dotnet build "$project" --configuration Release
          done

  ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Build iOS heads
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64) rid=iossimulator-arm64 ;;
            x86_64) rid=iossimulator-x64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          for project in vignettes/*/iOS/*.iOS.csproj; do
            dotnet build "$project" --configuration Release -p:RuntimeIdentifier="$rid"
          done
